  <style>
    .trace { animation: scroll 7s linear infinite; }
    .t2 { animation-duration: 9s; } .t3 { animation-duration: 6s; } .t4 { animation-duration: 11s; }
    .vox { animation: fade 3.6s ease-in-out infinite; }
    .v2 { animation-delay: .9s; } .v3 { animation-delay: 1.8s; } .v4 { animation-delay: 2.7s; }
    .scan { animation: sweep 5s ease-in-out infinite alternate; }
    @keyframes scroll { to { transform: translateX(-240px); } }
    @keyframes fade { 50% { opacity: .25; } }
    @keyframes sweep { to { transform: translateY(150px); } }
    @media (prefers-reduced-motion: reduce) { .trace, .vox, .scan { animation: none; } }
  </style>
