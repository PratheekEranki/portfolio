<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-hidden="true">
  <style>
    .packet { animation: travel 2.8s linear infinite; }
    .back { animation: travel-back 2.8s linear infinite; animation-delay: 1.4s; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    .ok { animation: pop 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes travel { from { transform: translateX(0); opacity: 0; } 10%, 90% { opacity: 1; } to { transform: translateX(250px); opacity: 0; } }
    @keyframes travel-back { from { transform: translateX(0); opacity: 0; } 10%, 90% { opacity: 1; } to { transform: translateX(-250px); opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pop { 0%, 60% { opacity: 0; transform: scale(.6); } 75%, 100% { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .packet, .back, .caret, .ok { animation: none; } }
  </style>
  <rect width="1200" height="340" fill="#18191d"/>
  <rect x="40" y="40" width="420" height="260" rx="10" fill="#1f2126" stroke="#2f3138"/>
  <rect x="40" y="40" width="420" height="34" rx="10" fill="#2a2c32"/>
  <rect x="40" y="64" width="420" height="10" fill="#2a2c32"/>
  <circle cx="62" cy="57" r="5" fill="#ff7d6b" opacity=".8"/><circle cx="80" cy="57" r="5" fill="#ffd166" opacity=".8"/><circle cx="98" cy="57" r="5" fill="#5ad19a" opacity=".8"/>
  <rect x="64" y="96" width="120" height="10" rx="5" fill="#5cc8f0" opacity=".8"/>
  <g fill="#222429" stroke="#3a3d45"><rect x="64" y="122" width="180" height="34" rx="6"/><rect x="64" y="168" width="180" height="34" rx="6"/></g>
  <rect class="caret" x="78" y="131" width="2" height="16" fill="#5cc8f0"/>
  <rect x="78" y="182" width="90" height="6" rx="3" fill="#6b6f78"/>
  <rect x="64" y="220" width="96" height="34" rx="6" fill="#5cc8f0"/>
  <rect x="84" y="234" width="56" height="6" rx="3" fill="#062533"/>
  <rect x="270" y="122" width="166" height="132" rx="6" fill="#222429" stroke="#3a3d45"/>
  <g fill="#3a3d45"><rect x="286" y="140" width="110" height="6" rx="3"/><rect x="286" y="160" width="130" height="6" rx="3"/><rect x="286" y="180" width="90" height="6" rx="3"/><rect x="286" y="200" width="120" height="6" rx="3"/><rect x="286" y="220" width="100" height="6" rx="3"/></g>
  <g font-family="monospace" font-size="15" fill="#9ea1a8">
    <text x="510" y="118">POST /api/records</text>
    <text x="510" y="238">200 OK</text>
  </g>
  <path d="M480 140H760" stroke="#3a3d45" stroke-width="2" stroke-dasharray="4 6"/>
  <path d="M480 200H760" stroke="#3a3d45" stroke-width="2" stroke-dasharray="4 6"/>
  <g class="packet"><rect x="490" y="132" width="34" height="16" rx="8" fill="#5cc8f0"/></g>
  <g class="back"><rect x="716" y="192" width="34" height="16" rx="8" fill="#a487ff"/></g>
  <circle class="ok" cx="586" cy="233" r="7" fill="#5ad19a"/>
  <rect x="790" y="40" width="200" height="260" rx="10" fill="#1f2126" stroke="#2f3138"/>
  <g font-family="monospace" font-size="15" fill="#5cc8f0"><text x="812" y="78">{ }</text></g>
  <g font-family="monospace" font-size="13" fill="#9ea1a8"><text x="848" y="78">Spring Boot</text></g>
  <g fill="#2a2c32" stroke="#3a3d45"><rect x="812" y="100" width="156" height="36" rx="6"/><rect x="812" y="148" width="156" height="36" rx="6"/><rect x="812" y="196" width="156" height="36" rx="6"/></g>
