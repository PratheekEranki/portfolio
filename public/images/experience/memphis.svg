<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-hidden="true">
  <style>
    .row { animation: slide 4.5s ease-in-out infinite; }
    .r2 { animation-delay: .5s; } .r3 { animation-delay: 1s; } .r4 { animation-delay: 1.5s; }
    .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 3s ease-in-out infinite alternate; }
    .b2 { animation-delay: .3s; } .b3 { animation-delay: .6s; } .b4 { animation-delay: .9s; } .b5 { animation-delay: 1.2s; } .b6 { animation-delay: 1.5s; }
    .trend { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 4s ease-in-out infinite; }
    @keyframes slide { 0%, 20% { opacity: .35; transform: translateX(-10px); } 40%, 100% { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleY(.6); } }
    @keyframes draw { 50%, 100% { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .row, .bar, .trend { animation: none; stroke-dashoffset: 0; } }
  </style>
